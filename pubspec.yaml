name: diet
description: 本地健身饮食助手 — 热量/食材/锻炼/记录/修仙
publish_to: 'none'
version: 2.5.0+61

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  intl: ^0.20.2
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  permission_handler: ^12.0.3
  health: ^13.3.1
  package_info_plus: ^9.0.0
  http: ^1.5.0
  open_filex: ^4.7.0
  share_plus: ^12.0.1
  file_picker: ^10.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  # For mocking path_provider in data_backup_repository_test.dart — both are
  # already transitive deps of path_provider, listed explicitly for a stable
  # test-only import rather than relying on transitive resolution.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/food_seed.json
    - assets/cultivation/
    - assets/ink/
    - assets/ink/icons/light/
    - assets/ink/icons/dark/
    - assets/splash/
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKaiLite-Medium.ttf
          weight: 500
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
